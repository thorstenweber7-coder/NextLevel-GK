# ==============================================================================
# 3. SPA CLIENT-SIDE ROUTING
# ==============================================================================
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/trainingsplanung/*"
  to = "/trainingsplanung/index.html"
  status = 200

[[redirects]]
  from = "/coach/*"
  to = "/coach/index.html"
  status = 200

# Legacy redirects from Keepersoftware folder
[[redirects]]
  from = "/Keepersoftware/*"
  to = "/app/:splat"
  status = 301

[[redirects]]
  from = "/Keepersoftware"
  to = "/app/"
  status = 301

# Cache headers for optimal asset performance
[[headers]]
  for = "/Assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Trainingsplanung/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/trainingsplanung/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/coach/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/coaching-suite/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
