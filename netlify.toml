# Netlify Configuration for NextLevel Goalkeeping
# Automatically builds both apps (Keepersoftware & Trainingsplanung) and serves all static pages from dist.

[build]
  command = "cd Keepersoftware && npm install && npm run build:frontend && cd ../Trainingsplanung && npm install && npm run build && cd .. && mkdir -p dist && cp -r Assets *.html dist/ 2>/dev/null || true && cp Assets/Logo.png dist/Logo.png 2>/dev/null || true && cp Assets/Logo.jpg dist/Logo.jpg 2>/dev/null || true && mkdir -p dist/app && cp -r Keepersoftware/dist/* dist/app/ && mkdir -p dist/trainingsplanung && cp -r Trainingsplanung/dist/* dist/trainingsplanung/ && mkdir -p dist/Trainingsplanung && cp -r Trainingsplanung/dist/* dist/Trainingsplanung/ && mkdir -p dist/coach && cp -r Trainingsplanung/dist/* dist/coach/ && mkdir -p dist/coaching-suite && cp -r Trainingsplanung/dist/* dist/coaching-suite/"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Central Login Hub
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

# ==============================================================================
# 1. DIRECT LOGIN LINKS FOR TORHÜTERINNEN & TORHÜTER (Keeper Portal -> /app/)
# ==============================================================================
[[redirects]]
  from = "/login-torhueter"
  to = "/app/"
  status = 301
  force = true

[[redirects]]
  from = "/login-keeper"
  to = "/app/"
  status = 301
  force = true

[[redirects]]
  from = "/keeper-login"
  to = "/app/"
  status = 301
  force = true

[[redirects]]
  from = "/keeper"
  to = "/app/"
  status = 301
  force = true

[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301
  force = true

# ==============================================================================
# 2. DIRECT LOGIN LINKS FOR TORWARTTRAINERINNEN & TORWARTTRAINER (Coach Suite -> /trainingsplanung/)
# ==============================================================================
[[redirects]]
  from = "/login-torwarttrainer"
  to = "/trainingsplanung/"
  status = 301
  force = true

[[redirects]]
  from = "/login-trainer"
  to = "/trainingsplanung/"
  status = 301
  force = true

[[redirects]]
  from = "/coach-login"
  to = "/trainingsplanung/"
  status = 301
  force = true

[[redirects]]
  from = "/trainer-login"
  to = "/trainingsplanung/"
  status = 301
  force = true

[[redirects]]
  from = "/coaching-suite-login"
  to = "/trainingsplanung/"
  status = 301
  force = true

[[redirects]]
