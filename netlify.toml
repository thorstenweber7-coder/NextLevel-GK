  to = "/trainingsplanung/"
  status = 301
  force = true

[[redirects]]
  from = "/coaching-suite"
  to = "/trainingsplanung/"
  status = 301
  force = true

[[redirects]]
  from = "/coaching-suite/*"
  to = "/trainingsplanung/"
  status = 301
  force = true

[[redirects]]
  from = "/coach-suite"
  to = "/trainingsplanung/"
  status = 301
  force = true

[[redirects]]
  from = "/coach-suite/*"
  to = "/trainingsplanung/"
  status = 301
  force = true

[[redirects]]
  from = "/coaching"
