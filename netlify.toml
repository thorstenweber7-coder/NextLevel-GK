  to = "/trainingsplanung/"
  status = 301
  force = true

[[redirects]]
  from = "/trainer/*"
  to = "/trainingsplanung/"
  status = 301
  force = true

[[redirects]]
  from = "/Trainingsplanung"
  to = "/trainingsplanung/"
  status = 301
  force = true

[[redirects]]
