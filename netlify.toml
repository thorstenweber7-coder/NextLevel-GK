# Netlify Configuration for NextLevel Goalkeeping
# Automatically builds both apps (Keepersoftware & Trainingsplanung) and serves all static pages from dist.

[build]
  command = "cd Keepersoftware && npm install && npm run build:frontend && cd ../Trainingsplanung && npm install && npm run build && cd .. && mkdir -p dist && cp -r Assets *.html dist/ 2>/dev/null || true && cp Assets/Logo.png dist/Logo.png 2>/dev/null || true && cp Assets/Logo.jpg dist/Logo.jpg 2>/dev/null || true && mkdir -p dist/app && cp -r Keepersoftware/dist/* dist/app/ && mkdir -p dist/coaching-suite && cp -r Trainingsplanung/dist/* dist/coaching-suite/ && mkdir -p dist/coach-suite && cp -r Trainingsplanung/dist/* dist/coach-suite/ && mkdir -p dist/coach && cp -r Trainingsplanung/dist/* dist/coach/ && mkdir -p dist/Trainingsplanung && cp -r Trainingsplanung/dist/* dist/Trainingsplanung/ && mkdir -p dist/trainingsplanung && cp -r Trainingsplanung/dist/* dist/trainingsplanung/"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Dedicated Direct Link Routes for Keeper & Coach Login Hubs
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/login-torhueter"
  to = "/login-torhueter.html"
  status = 200

[[redirects]]
  from = "/login-keeper"
  to = "/login-torhueter.html"
  status = 200

[[redirects]]
  from = "/keeper-login"
  to = "/login-torhueter.html"
  status = 200

[[redirects]]
  from = "/login-torwarttrainer"
  to = "/login-torwarttrainer.html"
  status = 200

[[redirects]]
  from = "/login-trainer"
  to = "/login-torwarttrainer.html"
  status = 200

[[redirects]]
  from = "/coach-login"
  to = "/login-torwarttrainer.html"
  status = 200

[[redirects]]
  from = "/trainer-login"
  to = "/login-torwarttrainer.html"
  status = 200

# Dedicated Direct Link Routes for Coaching Suite Gateway
[[redirects]]
  from = "/coaching-suite-login"
  to = "/coaching-suite.html"
  status = 200

[[redirects]]
  from = "/coach-suite-login"
  to = "/coach-suite.html"
  status = 200

# SPA client-side routing for the Keepersoftware (/app)
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Trailing slash redirect for /app
[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

# Legacy redirects from Keepersoftware folder
[[redirects]]
  from = "/Keepersoftware/*"
  to = "/app/:splat"
  status = 301

[[redirects]]
  from = "/Keepersoftware"
  to = "/app/"
  status = 301

# SPA client-side routing for Coaching Suite (/coaching-suite)
[[redirects]]
  from = "/coaching-suite/*"
  to = "/coaching-suite/index.html"
  status = 200

[[redirects]]
  from = "/coaching-suite"
  to = "/coaching-suite/"
  status = 301

# SPA client-side routing for Coach Suite (/coach-suite)
[[redirects]]
  from = "/coach-suite/*"
  to = "/coach-suite/index.html"
  status = 200

[[redirects]]
  from = "/coach-suite"
  to = "/coach-suite/"
  status = 301

# Short alias /coaching
[[redirects]]
  from = "/coaching/*"
  to = "/coaching-suite/index.html"
  status = 200

[[redirects]]
  from = "/coaching"
  to = "/coaching-suite/"
  status = 301

